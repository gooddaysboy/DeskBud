<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品详情 · DeskBud.xyz</title>
  <meta name="description" content="桌面宠物作品详情：图文/GIF/视频预览与下载。">
  <link rel="stylesheet" href="assets/css/base.css?v=27">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="dot"></span>DeskBud.xyz</a>
    <span class="brand-sub"> · 让桌面不再孤单</span>
    <form class="site-search" id="siteSearch" role="search">
      <input type="search" id="siteSearchInput" placeholder="搜索作品名称、描述…" aria-label="搜索作品">
      <button type="submit" class="site-search-btn">搜索</button>
      <div class="site-search-results" id="siteSearchResults" hidden></div>
    </form>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="list.html">作品</a>
        <a href="index.html#categories">分类</a>
        <a href="usage.html">使用说明</a>
        <a href="privacy.html">隐私说明</a>
        <a href="contact.html">联系我们</a>
      </nav>
    </div>
  </header>

  <section class="page-header wrap">
    <h1 id="dtTitle">作品详情</h1>
    <p class="ph-sub">桌面宠物作品预览与下载</p>
  </section>

  <section class="section wrap detail-hero">
    <p style="margin:0 0 8px"><a href="list.html" style="color:var(--ink-faint)">← 返回作品列表</a></p>
    <div id="detail"></div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div class="footer-top">
        <div>© <span id="yr"></span> DeskBud.xyz · 桌面宠物作品分享站</div>
        <div>趣味桌面宠物伙伴 · 常驻你的屏幕</div>
      </div>
      <div class="footer-bottom">
        <a href="contact.html">联系我们（邮箱）</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/site.js?v=13"></script>
  <script>
    (async () => {
      const d = await SITE.load();
      document.getElementById('yr').textContent = new Date().getFullYear();
      const id = new URLSearchParams(location.search).get('id');
      const w = d.works.find(x => x.id === id);

      if (!w) {
        document.getElementById('detail').innerHTML = '<div class="empty">未找到该作品</div>';
        return;
      }
      document.title = w.title + ' · DeskBud.xyz';
      const dt = document.getElementById('dtTitle');
      if (dt) dt.textContent = w.title;

      const mediaHTML = (w.media || []).map(m => {
        if (m.type === 'video')
          return `<figure class="m-item"><video src="${m.src}" controls preload="metadata"></video><figcaption>${m.caption || ''}</figcaption></figure>`;
        return `<figure class="m-item"><img src="${m.src}" alt="${m.caption || ''}" loading="lazy"><figcaption>${m.caption || ''}</figcaption></figure>`;
      }).join('');

      // 额外占位预览：复用 cover/thumb，把空出来的窗口填满
      const extras = [];
      if (w.cover && !(w.media || []).some(m => m.src === w.cover)) extras.push({ src: w.cover, cap: '封面' });
      if (w.thumb && w.thumb !== w.cover && !(w.media || []).some(m => m.src === w.thumb)) extras.push({ src: w.thumb, cap: '缩略图' });
      const walkGif = (w.media || []).find(m => m.type === 'gif' && /walk|run|fly|move/i.test(m.src));
      if (!walkGif) {
        // 找不到 walk 类动图，就再放一张 cover 当占位，保证有内容
        extras.push({ src: w.cover || w.thumb, cap: '动态预览（占位）' });
      }
      const extraHTML = extras.map(x => `<figure class="m-item"><img src="${x.src}" alt="${x.cap}" loading="lazy"><figcaption>${x.cap}</figcaption></figure>`).join('');

      document.getElementById('detail').innerHTML = `
        <div class="detail-grid">
          <div class="detail-main">
            <h1 class="detail-title">${w.title}</h1>
            <p class="detail-sub">${w.summary}</p>
            <div class="detail-body"><p>${w.description}</p></div>
            <div class="media-gallery">
              ${mediaHTML}
              ${extraHTML}
            </div>
          </div>
          <aside class="sidebar">
            <div class="row"><span>分类</span><span>${SITE.catName(w.category)}</span></div>
            <div class="row"><span>作者</span><span>${w.author}</span></div>
            <div class="row"><span>更新</span><span>${w.date}</span></div>
            <div class="row"><span>页面访问</span><span class="stat"><span id="busuanzi_container_page_pv">🔥 <span id="busuanzi_value_page_pv">-</span></span></span></div>
            <div class="row"><span>下载次数</span><span class="stat">${SITE.fmt(w.downloads)}</span></div>
            <div class="download-box">
              <a class="btn btn-primary" href="${w.download.url}" target="_blank" rel="noopener">⬇ ${w.download.label}</a>
            </div>
          </aside>
        </div>`;

      ensureBusuanzi();
    })();
  </script>
</body>
</html>
