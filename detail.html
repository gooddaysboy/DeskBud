<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品详情 · DeskBud.xyz</title>
  <meta name="description" content="桌面宠物作品详情：图文/GIF/视频预览与下载。">
  <link rel="stylesheet" href="assets/css/base.css?v=31">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="dot"></span>DeskBud.xyz<span class="brand-sub" data-i18n="brand.sub"> · 让桌面不再孤单</span></a>
      <form class="site-search" id="siteSearch" role="search">
        <input type="search" id="siteSearchInput" data-i18n-attr="placeholder:search.ph,aria-label:search.label" placeholder="搜索作品名称、描述…" aria-label="搜索作品">
        <button type="submit" class="site-search-btn" data-i18n="search.btn">搜索</button>
        <div class="site-search-results" id="siteSearchResults" hidden></div>
      </form>
      <nav class="nav">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="list.html" data-i18n="nav.works">作品</a>
        <a href="usage.html" data-i18n="nav.usage">使用说明</a>
        <a href="privacy.html" data-i18n="nav.privacy">隐私说明</a>
        <a href="contact.html" data-i18n="nav.contact">联系我们</a>
        <button id="langSwitch" class="lang-switch" type="button">EN</button>
      </nav>
    </div>
  </header>

  <section class="page-header wrap">
    <h1 id="dtTitle">作品详情</h1>
    <p class="ph-sub" data-i18n="detail.sub">桌面宠物作品预览与下载</p>
  </section>

  <section class="section wrap detail-hero">
    <p style="margin:0 0 8px"><a href="list.html" style="color:var(--ink-faint)" data-i18n="detail.back">← 返回作品</a></p>
    <div id="detail"></div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div class="footer-top">
        <div>© <span id="yr"></span> DeskBud.xyz · <span data-i18n="footer.site">桌面宠物作品分享站</span></div>
        <div data-i18n="footer.tagline">趣味桌面宠物伙伴 · 常驻你的屏幕</div>
      </div>
      <div class="footer-bottom">
        <a href="contact.html" data-i18n="footer.contact">联系我们（邮箱）</a>
      </div>
    </div>
  </footer>

  <script src="assets/vendor/i18n/i18next.min.js"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/site.js?v=17"></script>
  <script>
    (async () => {
      const d = await SITE.load();
      document.getElementById('yr').textContent = new Date().getFullYear();
      const id = new URLSearchParams(location.search).get('id');

      function renderDetail(data, wid) {
        const w = data.works.find(x => x.id === wid);
        if (!w) {
          document.getElementById('detail').innerHTML = '<div class="empty">' + window.pick({ zh: '未找到该作品', en: 'Work not found' }) + '</div>';
          return;
        }
        document.title = window.pick(w.title) + ' · DeskBud.xyz';
        const dt = document.getElementById('dtTitle');
        if (dt) dt.textContent = window.pick(w.title);

        const mediaHTML = (w.media || []).map(m => {
          if (m.type === 'video')
            return `<figure class="m-item"><video src="${m.src}" controls preload="metadata"></video><figcaption>${window.pick(m.caption)}</figcaption></figure>`;
          return `<figure class="m-item"><img src="${m.src}" alt="${window.pick(m.caption)}" loading="lazy"><figcaption>${window.pick(m.caption)}</figcaption></figure>`;
        }).join('');

        const extras = [];
        if (w.cover && !(w.media || []).some(m => m.src === w.cover)) extras.push({ src: w.cover, cap: window.pick({ zh: '封面', en: 'Cover' }) });
        if (w.thumb && w.thumb !== w.cover && !(w.media || []).some(m => m.src === w.thumb)) extras.push({ src: w.thumb, cap: window.pick({ zh: '缩略图', en: 'Thumbnail' }) });
        const walkGif = (w.media || []).find(m => m.type === 'gif' && /walk|run|fly|move/i.test(m.src));
        if (!walkGif) extras.push({ src: w.cover || w.thumb, cap: window.pick({ zh: '动态预览（占位）', en: 'Motion preview (placeholder)' }) });
        const extraHTML = extras.map(x => `<figure class="m-item"><img src="${x.src}" alt="${x.cap}" loading="lazy"><figcaption>${x.cap}</figcaption></figure>`).join('');

        document.getElementById('detail').innerHTML = `
          <div class="detail-grid">
            <div class="detail-main">
              <h1 class="detail-title">${window.pick(w.title)}</h1>
              <p class="detail-sub">${window.pick(w.summary)}</p>
              <div class="detail-body"><p>${window.pick(w.description)}</p></div>
              <div class="media-gallery">
                ${mediaHTML}
                ${extraHTML}
              </div>
            </div>
            <aside class="sidebar">
              <div class="row"><span>${window.pick({ zh: '分类', en: 'Category' })}</span><span>${SITE.catName(w.category)}</span></div>
              <div class="row"><span>${window.pick({ zh: '作者', en: 'Author' })}</span><span>${window.pick(w.author)}</span></div>
              <div class="row"><span>${window.pick({ zh: '更新', en: 'Updated' })}</span><span>${w.date}</span></div>
              <div class="row"><span>${window.pick({ zh: '页面访问', en: 'Page views' })}</span><span class="stat"><span id="busuanzi_container_page_pv">🔥 <span id="busuanzi_value_page_pv">-</span></span></span></div>
              <div class="row"><span>${window.pick({ zh: '下载次数', en: 'Downloads' })}</span><span class="stat">${SITE.fmt(w.downloads)}</span></div>
              <div class="download-box">
                <a class="btn btn-primary" href="${w.download.url}" target="_blank" rel="noopener">⬇ ${window.pick(w.download.label)}</a>
              </div>
            </aside>
          </div>`;
        ensureBusuanzi();
      }

      renderDetail(d, id);

      // 语言切换时重渲染详情
      window.__rerender = () => renderDetail(SITE.data, id);
    })();
  </script>
</body>
</html>
