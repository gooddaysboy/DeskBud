<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品列表 · DeskBud.xyz</title>
  <meta name="description" content="DeskBud.xyz 全部桌面宠物作品，支持分类筛选与排序（最新、下载量、热门）。">
  <link rel="stylesheet" href="assets/css/base.css?v=20">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="dot"></span>DeskBud.xyz<span class="brand-sub"> · 让桌面不再孤单</span></a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="list.html">作品</a>
        <a href="usage.html">使用说明</a>
        <a href="privacy.html">隐私说明</a>
        <a href="contact.html">联系我们</a>
      </nav>
    </div>
  </header>

  <section class="page-header wrap">
    <h1>作品</h1>
    <p class="ph-sub">浏览全部桌面宠物伙伴，按分类筛选你喜欢的那个。</p>
  </section>

  <section class="section wrap">
    <div class="section-head">
      <div>
        <h2 class="section-title">全部作品</h2>
        <p class="section-sub" id="countTip"></p>
      </div>
      <div class="sortbar">
        <label for="sort">排序</label>
        <select id="sort">
          <option value="latest">最新</option>
          <option value="downloads">下载量</option>
          <option value="hot">热门</option>
        </select>
      </div>
    </div>

    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">该分类下暂无作品</div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div class="footer-top">
        <div>© <span id="yr"></span> DeskBud.xyz · 桌面宠物作品分享站</div>
        <div>汇集开源 / 自制桌面宠物伙伴 · 常驻你的屏幕</div>
      </div>
      <div class="footer-bottom">
        <a href="contact.html">联系我们（邮箱）</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/site.js?v=9"></script>
  <script src="assets/js/bubble.js?v=17"></script>
  <script>
    (async () => {
      const d = await SITE.load();
      await BUBBLE.load(); // 拉一次语录
      document.getElementById('yr').textContent = new Date().getFullYear();

      const params = new URLSearchParams(location.search);
      let curCat = params.get('cat') || 'all';
      let curSort = params.get('sort') || 'latest';
      let bubbleCleanups = [];

      // 分类筛选条：全部 + 一级 + 其下的二级，全部平铺展示（带 emoji 图标）
      const filters = document.getElementById('filters');
      function renderFilters() {
        const parts = [`<button class="chip" data-cat="all">${SITE.catIcon('all')} 全部</button>`];
        d.categories.filter(c => c.id !== 'all').forEach(c => {
          parts.push(`<button class="chip${c.id === curCat ? ' active' : ''}" data-cat="${c.id}">${SITE.catIcon(c.id)} ${c.name}</button>`);
          if (c.children) {
            c.children.forEach(ch => {
              parts.push(`<button class="chip sub${ch.id === curCat ? ' active' : ''}" data-cat="${ch.id}">${SITE.catIcon(ch.id)} ${ch.name}</button>`);
            });
          }
        });
        filters.innerHTML = parts.join('');
        filters.querySelectorAll('.chip').forEach(btn => {
          btn.addEventListener('click', () => {
            curCat = btn.dataset.cat;
            renderFilters();
            render();
          });
        });
      }

      // 排序
      const sortEl = document.getElementById('sort');
      sortEl.value = curSort;
      sortEl.addEventListener('change', () => { curSort = sortEl.value; render(); });

      function render() {
        // 清理上一批泡泡计时器，避免筛选切换后泄漏
        bubbleCleanups.forEach(fn => fn());
        bubbleCleanups = [];
        let list = d.works.slice();
        const ids = SITE.expandCatIds(curCat);
        if (ids) list = list.filter(w => ids.includes(w.category));
        list = SITE.sortWorks(list, curSort);
        document.getElementById('countTip').textContent = `共 ${list.length} 个作品`;
        const grid = document.getElementById('grid');
        grid.innerHTML = list.map(SITE.cardHTML).join('');
        document.getElementById('empty').style.display = list.length ? 'none' : 'block';
        // 每个卡片独立持续飘：该卡片窗口始终有 1 条，下一条提前衔接，不空屏
        document.querySelectorAll('.card-bubbles').forEach(el => {
          bubbleCleanups.push(BUBBLE.renderKeep(el, el.dataset.pet, { minDur: 16000, maxDur: 24000 }));
        });
      }
      renderFilters();
      render();
      ensureBusuanzi();
    })();
  </script>
</body>
</html>
