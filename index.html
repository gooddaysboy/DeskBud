<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskBud · 陪伴你的桌面宠物伙伴</title>
  <meta name="description" content="DeskBud.xyz —— 面向桌面宠物爱好者，汇集各类开源与自制桌面宠物伙伴作品，支持浏览、预览与下载。">
  <link rel="stylesheet" href="assets/css/base.css?v=9">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="dot"></span>DeskBud</a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="list.html">作品</a>
        <a href="#categories">分类</a>
      </nav>
    </div>
  </header>

  <section class="hero wrap">
    <h1>DeskBud</h1>
    <p class="slogan">陪伴你的桌面宠物伙伴</p>
    <p class="sub">面向桌面宠物爱好者 · 你的桌面屏幕上，常驻的宠物伙伴</p>
    <div class="actions">
      <a class="btn btn-primary" href="list.html">浏览作品 →</a>
      <a class="btn btn-ghost" href="#categories">按分类探索</a>
    </div>
  </section>

  <section class="section wrap" id="hot">
    <div class="section-head">
      <div>
        <h2 class="section-title">热门作品</h2>
        <p class="section-sub">大家正在下载的桌面伙伴</p>
      </div>
      <a class="btn btn-ghost" href="list.html">查看全部</a>
    </div>
    <div class="grid" id="hotGrid"></div>
  </section>

  <section class="section wrap" id="categories">
    <div class="section-head">
      <div>
        <h2 class="section-title">分类导航</h2>
        <p class="section-sub">挑一个你喜欢的类型</p>
      </div>
    </div>
    <div class="filters" id="catNav"></div>
    <div class="grid" id="catGrid"></div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div>© <span id="yr"></span> DeskBud.xyz · 桌面宠物作品分享站</div>
      <div>汇集开源 / 自制桌面宠物伙伴 · 常驻你的屏幕</div>
    </div>
  </footer>

  <script src="assets/js/site.js?v=9"></script>
  <script src="assets/js/bubble.js?v=9"></script>
  <script>
    (async () => {
      const d = await SITE.load();
      await BUBBLE.load(); // 拉一次语录，页面生命周期内不再请求
      document.getElementById('yr').textContent = new Date().getFullYear();

      // 热门：featured 优先 + 下载量
      const hot = SITE.sortWorks(d.works, 'hot').slice(0, 4);
      document.getElementById('hotGrid').innerHTML = hot.map(SITE.cardHTML).join('');

      // 分类导航（带 emoji 图标）
      const nav = document.getElementById('catNav');
      const navParts = d.categories.map(c => {
        if (c.children) {
          const sub = c.children.map(ch => `<a class="chip sub" href="list.html?cat=${ch.id}">${SITE.catIcon(ch.id)} ${ch.name}</a>`).join('');
          return `<a class="chip" href="list.html?cat=${c.id}">${SITE.catIcon(c.id)} ${c.name}</a>${sub}`;
        }
        return `<a class="chip" href="list.html?cat=${c.id}">${SITE.catIcon(c.id)} ${c.name}</a>`;
      }).join('');
      nav.innerHTML = navParts;
      // 分类预览：每个一级取 1 个（优先叶子分类）
      const preview = [];
      d.categories.filter(c => c.id !== 'all').forEach(c => {
        const ids = SITE.expandCatIds(c.id);
        const w = d.works.find(x => ids.includes(x.category));
        if (w) preview.push(w);
      });
      document.getElementById('catGrid').innerHTML = preview.map(SITE.cardHTML).join('');

      // 首页卡片边飘泡泡（每个宠物自己专属+公共，数量少）
      document.querySelectorAll('.card-bubbles').forEach(el => {
        BUBBLE.render(el, el.dataset.pet, 2);
      });

      ensureBusuanzi();
    })();
  </script>
</body>
</html>
