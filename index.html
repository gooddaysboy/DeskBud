<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskBud.xyz · 让桌面不再孤单</title>
  <meta name="description" content="DeskBud.xyz —— 面向桌面宠物爱好者，汇集各类趣味桌面宠物伙伴作品，支持浏览、预览与下载。">
  <link rel="stylesheet" href="assets/css/base.css?v=34">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="dot"></span>DeskBud.xyz<span class="brand-sub" data-i18n="brand.sub"> · 让桌面不再孤单</span></a>
      <form class="site-search" id="siteSearch" role="search">
        <input type="search" id="siteSearchInput" data-i18n-attr="placeholder:search.ph,aria-label:search.label" placeholder="搜索作品名称、描述…" aria-label="搜索作品">
        <button type="submit" class="site-search-btn" data-i18n="search.btn">搜索</button>
        <div class="site-search-results" id="siteSearchResults" hidden></div>
      </form>
      <nav class="nav">
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="list.html" data-i18n="nav.works">作品</a>
        <a href="usage.html" data-i18n="nav.usage">使用说明</a>
        <a href="privacy.html" data-i18n="nav.privacy">隐私说明</a>
        <a href="contact.html" data-i18n="nav.contact">联系我们</a>
        <button id="langSwitch" class="lang-switch" type="button">EN</button>
      </nav>
    </div>
  </header>

  <section class="hero wrap">
    <h1 data-i18n="hero.title">DeskBud</h1>
    <p class="slogan" data-i18n="hero.slogan">陪伴你的桌面宠物伙伴</p>
    <p class="sub" data-i18n="hero.sub">常驻的桌面宠物伙伴，向您展现独特的性格与灵魂</p>
  </section>

  <section class="section wrap" id="hot">
    <div class="section-head">
      <div>
        <h2 class="section-title" data-i18n="home.hot">热门作品</h2>
        <p class="section-sub" data-i18n="home.hotSub">挑一个喜欢的桌宠，领回你的桌面</p>
      </div>
      <a class="btn btn-ghost" href="list.html" data-i18n="home.all">查看全部</a>
    </div>
    <div class="grid" id="hotGrid"></div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div class="footer-top">
        <div>© <span id="yr"></span> DeskBud.xyz · 桌面宠物作品分享站</div>
        <div data-i18n="footer.tagline">趣味桌面宠物伙伴 · 常驻你的屏幕</div>
      </div>
      <div class="footer-bottom">
        <a href="contact.html" data-i18n="footer.contact">联系我们（邮箱）</a>
      </div>
    </div>
  </footer>

  <script src="assets/vendor/i18n/i18next.min.js"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/site.js?v=17"></script>
  <script src="assets/js/bubble.js?v=18"></script>
  <script>
    (async () => {
      const d = await SITE.load();
      await BUBBLE.load(); // 拉一次语录，页面生命周期内不再请求
      document.getElementById('yr').textContent = new Date().getFullYear();

      // 热门：featured 优先 + 下载量
      const hot = SITE.sortWorks(d.works, 'hot').slice(0, 4);
      document.getElementById('hotGrid').innerHTML = hot.map(SITE.cardHTML).join('');

      // 每个卡片独立持续飘：该卡片窗口始终有 1 条，旧气泡将消失时下一条已升起衔接，不空屏
      document.querySelectorAll('.card-bubbles').forEach(el => {
        BUBBLE.renderKeep(el, el.dataset.pet, { minDur: 16000, maxDur: 24000 });
      });

      // 语言切换时重渲染热门区（卡片/气泡按新语言）
      window.__rerender = () => {
        const h = SITE.sortWorks(SITE.data.works, 'hot').slice(0, 4);
        document.getElementById('hotGrid').innerHTML = h.map(SITE.cardHTML).join('');
        document.querySelectorAll('.card-bubbles').forEach(el => {
          BUBBLE.renderKeep(el, el.dataset.pet, { minDur: 16000, maxDur: 24000 });
        });
      };

      ensureBusuanzi();
    })();
  </script>
</body>
</html>
