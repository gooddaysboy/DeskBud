  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    function copyText(btn, text) {
      const ok = () => { const old = btn.textContent; btn.textContent = '已复制 ✓'; btn.disabled = true; setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1400); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok).catch(() => prompt('复制：', text));
      else prompt('复制：', text);
    }
  </script>
