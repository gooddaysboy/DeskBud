<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 · DeskBud.xyz</title>
  <meta name="description" content="DeskBud 反馈与交流：电子邮件">
  <link rel="stylesheet" href="assets/css/base.css?v=23">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="dot"></span>DeskBud.xyz<span class="brand-sub"> · 让桌面不再孤单</span></a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="list.html">作品</a>
        <a href="usage.html">使用说明</a>
        <a href="privacy.html">隐私说明</a>
        <a href="contact.html">联系我们</a>
      </nav>
    </div>
  </header>

  <section class="page-header wrap">
    <h1>联系我们</h1>
    <p class="ph-sub">Bug 反馈、功能建议、想聊桌宠——欢迎找我们。</p>
  </section>

  <section class="section wrap">
    <div class="contact-grid">
      <div class="contact-card">
        <div class="contact-head">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7L4 6h16l-8 6zm-9 6l6-4.5L12 15l3-2.5L21 18H3z"/></svg>
          </span>
          <div>
            <h3>电子邮件</h3>
            <p>合作 / 媒体 / 严重 Bug / 长期沟通</p>
          </div>
        </div>
        <div class="contact-body">
          <a class="contact-value" href="mailto:hi@deskbud.xyz">hi@deskbud.xyz</a>
          <button class="contact-btn" onclick="copyText(this, 'hi@deskbud.xyz')">点击复制</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div class="footer-top">
        <div>© <span id="yr"></span> DeskBud.xyz · 桌面宠物作品分享站</div>
        <div>趣味桌面宠物伙伴 · 常驻你的屏幕</div>
      </div>
      <div class="footer-bottom">
        <a href="contact.html">联系我们（邮箱）</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/site.js?v=12"></script>
  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    function copyText(btn, text) {
      const ok = () => { const old = btn.textContent; btn.textContent = '已复制 ✓'; btn.disabled = true; setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 1400); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok).catch(() => prompt('复制：', text));
      else prompt('复制：', text);
    }
  </script>
</body>
</html>
