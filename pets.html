  <script>
  (function () {
    var grid = document.getElementById('petsGrid');
    var from = '';
    try { from = new URLSearchParams(location.search).get('from') || ''; } catch (e) {}

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    function withFrom(url) {
      if (!url || !from) return url;
      return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'from=' + encodeURIComponent(from);
    }

    function action(url, label, cls, soonKey, soonFb) {
      var text = url ? esc(window.pick(label)) : esc(window.I18N.t(soonKey, soonFb));
      if (url) return '<a class="btn ' + cls + '" href="' + esc(withFrom(url)) + '" target="_blank" rel="noopener">' + text + '</a>';
      return '<span class="btn ' + cls + '" style="opacity:.5;pointer-events:none">' + text + '</span>';
    }

    function card(p) {
      var online = p.status === 'online';
      var cover = p.cover
        ? '<img src="' + esc(p.cover) + '" alt="' + esc(window.pick(p.title)) + '" loading="lazy" draggable="false">'
        : '<span class="pet-emoji">' + esc(p.emoji || '🐾') + '</span>';
      var badge = online
        ? '<span class="pet-badge">' + esc(window.I18N.t('pets.badgeOnline', '已上线')) + '</span>'
        : '<span class="pet-badge soon">' + esc(window.I18N.t('pets.badgeSoon', '织制中')) + '</span>';
      var detail = p.detail
        ? '<a class="btn" href="' + esc(withFrom(p.detail)) + '">' + esc(window.I18N.t('pets.detail', '了解详情')) + '</a>'
        : '';
      var actions = '';
      if (online) {
        actions =
          action(p.download && p.download.url, (p.download && p.download.label) || { zh: '下载', en: 'Download' }, 'btn-primary', 'pets.soonBtn', '下载即将上线') +
          action(p.buy && p.buy.url, (p.buy && p.buy.label) || { zh: '购买角色包', en: 'Buy PetPack' }, '', 'pets.soonBuy', '购买渠道即将上线') +
          detail;
      } else {
        actions = '<span class="pet-soon-note">' + esc(window.I18N.t('pets.soonNote', '织好之后第一时间上线，敬请期待～')) + '</span>';
      }
      return '<article class="pet-card' + (online ? '' : ' is-soon') + '">' +
        '<div class="pet-cover">' + cover + badge + '</div>' +
        '<div class="pet-body">' +
          '<h3 class="pet-name">' + esc(window.pick(p.title)) + '</h3>' +
          '<p class="pet-tagline">' + esc(window.pick(p.tagline)) + '</p>' +
          '<div class="pet-actions">' + actions + '</div>' +
        '</div></article>';
    }

    var chansBox = document.getElementById('petsChannels');
    function renderChans(data) {
      var chans = (data && data.channels) || [];
      if (!chans.length || !data.channelsVisible || !chansBox) return;
      var items = chans.map(function (c) {
        var name = esc(window.pick(c.label));
        return c.url ? '<a href="' + esc(withFrom(c.url)) + '" target="_blank" rel="noopener">' + name + '</a>' : name;
      }).join(' / ');
      chansBox.innerHTML = window.pick({ zh: '也可在 {list} 搜索 DeskBud', en: 'Also find DeskBud on {list}' }).replace('{list}', items);
      chansBox.hidden = false;
    }

    function render(data) {
      var pets = (data && data.pets) || [];
      function paint() {
        grid.innerHTML = pets.map(card).join('');
        renderChans(data);
      }
      paint();
      if (!window.__petsLangWired) {
        window.__petsLangWired = true;
        window.addEventListener('lang:change', paint);  // 只绑一次，避免切 N 次语言叠 N 个监听
      }
    }

    fetch('data/catalog.json?cv=3', { cache: 'no-cache' })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () { grid.innerHTML = '<p class="pets-note">加载失败，请刷新重试。</p>'; });
  })();
  </script>
