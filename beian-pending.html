<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskBud · 备案中</title>
<style>
  :root{ --bg:#fff7fb; --fg:#5a4a55; --accent:#ff8fb3; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .card{
    max-width:460px; padding:40px 32px; text-align:center;
    background:#fff; border-radius:18px; box-shadow:0 8px 30px rgba(255,143,179,.18);
  }
  h1{ font-size:22px; margin:0 0 14px; }
  p{ font-size:15px; line-height:1.75; margin:8px 0; color:#7a6a74; }
  .dl{
    display:inline-block; margin-top:18px; padding:12px 24px; border-radius:999px;
    background:var(--accent); color:#fff; text-decoration:none; font-weight:600; font-size:15px;
  }
  .dl:hover{ opacity:.92; }
  .tip{ margin-top:18px; font-size:13px; color:#a99aa3; }
</style>
</head>
<body>
  <div class="card">
    <h1>🐾 DeskBud 桌宠官网备案中</h1>
    <p>本站点为个人非经营性展示项目，正在办理 ICP 备案，暂短暂停服。</p>
    <p>已安装客户端的用户不受影响，伙伴与功能照常使用。</p>
    <a class="dl" href="https://gitee.com/deskbud/version/releases">⬇ 下载 DeskBud 客户端</a>
    <p class="tip">备案完成后将恢复访问，感谢等待。</p>
  </div>
</body>
</html>
